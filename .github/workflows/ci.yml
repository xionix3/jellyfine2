name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - name: pyflakes
        run: python -m pyflakes src/JellyfinOpenPLi scripts tests/*.py
      - name: Python 3.6+ syntax / compile check
        run: python scripts/check_syntax.py
      - name: Translations complete (English, Dutch)
        run: python scripts/i18n.py check
      - name: Tabs only (Enigma2 code style)
        run: |
          if grep -nP '^\t* +\S' src/JellyfinOpenPLi/*.py; then
            echo "::error::space indentation found"; exit 1
          fi

  test:
    name: "Tests (py ${{ matrix.python }}, OpenPLi ${{ matrix.openpli }}, Jellyfin ${{ matrix.jellyfin }}, ${{ matrix.height }}p)"
    needs: lint
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is no longer shipped for the newest Ubuntu runner image
          - { python: "3.9",  openpli: "release-9.0", jellyfin: "10.8.13",  height: 1080, os: ubuntu-24.04 }
          - { python: "3.11", openpli: "release-9.0", jellyfin: "10.10.7",  height: 1080 }
          - { python: "3.12", openpli: "release-9.2", jellyfin: "10.10.7",  height: 1080 }
          - { python: "3.12", openpli: "release-9.2", jellyfin: "10.10.7",  height: 720 }
          - { python: "3.13", openpli: "release-9.2", jellyfin: "10.11.2",  height: 1080 }
    env:
      E2_KEYMAP: ${{ github.workspace }}/tests/keymap.xml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pillow
      - name: Fetch OpenPLi keymap (${{ matrix.openpli }})
        run: curl -fsSL "https://raw.githubusercontent.com/OpenPLi/enigma2/${{ matrix.openpli }}/data/keymap.xml" -o tests/keymap.xml
      - name: Rule engine
        run: python tests/test_rules.py
      - name: End-to-end UI flow against fake Jellyfin server
        run: python tests/test_flow.py ${{ matrix.jellyfin }} ${{ matrix.height }}

  build:
    name: Build IPK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^CLIENT_VERSION = "\(.*\)"/\1/p' src/JellyfinOpenPLi/jfapi.py)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match CLIENT_VERSION $v"; exit 1
          fi
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python scripts/build_ipk.py dist
      - name: Verify package
        run: |
          ipk=$(ls dist/*.ipk)
          ar t "$ipk" | tr '\n' ' ' | grep -q '^debian-binary control.tar.gz data.tar.gz' || { echo "::error::wrong ar member order"; exit 1; }
          dpkg-deb -I "$ipk"
          dpkg-deb -c "$ipk"
          dpkg-deb -c "$ipk" | grep -q './usr/lib/enigma2/python/Plugins/Extensions/JellyfinOpenPLi/plugin.py'
          mkdir -p /tmp/root && dpkg-deb -x "$ipk" /tmp/root
          python -m py_compile /tmp/root/usr/lib/enigma2/python/Plugins/Extensions/JellyfinOpenPLi/*.py
          for l in en nl; do test -s /tmp/root/usr/lib/enigma2/python/Plugins/Extensions/JellyfinOpenPLi/locale/$l.po || { echo "::error::locale/$l.po missing"; exit 1; }; done
          dpkg-deb -f "$ipk" Replaces | grep -qx 'enigma2-plugin-extensions-jellyfine2' || { echo "::error::missing Replaces of the old package name"; exit 1; }
          # stable name for ".../releases/latest/download/..." one-line installs
          cp "$ipk" dist/enigma2-plugin-extensions-jellyfine-enigma2-openpli_all.ipk
          # old stable name: auto-update of installs up to 1.3.1 and old install commands
          cp "$ipk" dist/enigma2-plugin-extensions-jellyfine2_all.ipk
          (cd dist && sha256sum *.ipk | tee SHA256SUMS)
      - name: Screenshots of the real screens (demo data)
        env:
          E2_KEYMAP: ${{ github.workspace }}/tests/keymap.xml
        run: |
          pip install pillow
          curl -fsSL https://raw.githubusercontent.com/OpenPLi/enigma2/release-9.2/data/keymap.xml -o tests/keymap.xml
          python tests/screenshots.py skin-previews
      - uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: skin-previews/

  release:
    name: GitHub Release
    # tag push, release published in the UI, or a version bump on main (auto-release)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ipk
          path: dist
      - name: Check downloaded package
        run: |
          ls -l dist
          test -f dist/enigma2-plugin-extensions-jellyfine-enigma2-openpli_all.ipk
          test -f dist/enigma2-plugin-extensions-jellyfine2_all.ipk
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Decide what to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^CLIENT_VERSION = "\(.*\)"/\1/p' src/JellyfinOpenPLi/jfapi.py)
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tag="v${ver}"
            if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Version $ver is already released - nothing to do"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Create release or attach package to it
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.ipk dist/SHA256SUMS --clobber
          else
            notes=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
            {
              echo "**Installation auf der Box / installation on the box:**"
              echo '```sh'
              echo "wget -O /tmp/jellyfin.ipk https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/enigma2-plugin-extensions-jellyfine-enigma2-openpli_all.ipk && opkg install /tmp/jellyfin.ipk && init 4 && sleep 2 && init 3"
              echo '```'
              echo
              echo "### Changes"
              echo "${notes:-See CHANGELOG.md}"
            } > notes.md
            gh release create "$TAG" dist/*.ipk dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "Jellyfin für Enigma2 $TAG" \
              --notes-file notes.md
          fi
